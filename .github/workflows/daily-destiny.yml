# 每日运势早报 · 云端生成与推送
#
# 触发方式（三选一，可并存，靠「当日幂等」保证一天只发一封）：
#   1. repository_dispatch  —— Cloudflare Worker 的 cron 每天 UTC 00:00 调用，准点、主力通道
#   2. workflow_dispatch     —— 手动在 Actions 页面点「Run workflow」，随时补发
#   3. schedule              —— GitHub 原生 cron，自愈兜底
#
# ⚠ 为什么需要第 3 条：GitHub 自家的 schedule 曾在 2026-08 出现平台级故障——
#   延迟数小时甚至整天不触发，而 workflow_dispatch 正常。因此这里采用
#   「多窗口轮询 + 当日幂等」的自愈设计：
#     · 在北京时间 08 / 09 / 10 / 11 / 12 / 13 点各试一次（UTC 0,1,2,3,4,5 的 17 分）
#     · 早于 08:00 直接跳过；到点后先查「今天是否已成功发过」
#     · 查命中就跳过，没命中才发，发完打个标记
#   结果：不管 Cloudflare 还是 GitHub 谁先成功，当天只出一封；
#         即使 GitHub 把某几次（甚至某几个小时）错过，只要当天有一次跑起来就会补发。
#
# 幂等标记的实现：用 GitHub Actions Cache，key = destiny-sent-YYYY-MM-DD（北京时间）。
#   免费、无需外部存储，且 7 天自动过期，不会堆积。
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   个人档案（仓库是公开的，出生数据一律不入库，由 Secrets 注入）：
#     DESTINY_NAME        例：江公子
#     DESTINY_GENDER      male 或 female
#     DESTINY_BIRTH       例：1980-07-17 09:28（公历，24 小时制）
#     DESTINY_LONGITUDE   例：119.30（出生地东经度数）
#     DESTINY_CITY        例：福州（仅用于展示，可省）
#   发信：
#     SMTP_HOST           例：smtp.qq.com
#     SMTP_PORT           例：465
#     SMTP_USER           例：your_account@qq.com
#     SMTP_PASS           QQ 邮箱须填「SMTP 授权码」，不是登录密码
#     MAIL_TO             例：your_account@qq.com

name: 每日运势早报

on:
  repository_dispatch:
    types: [daily-destiny]
  workflow_dispatch:
    inputs:
      force:
        description: '忽略幂等标记强制发送（今天想补发一封时勾上）'
        type: boolean
        default: false
  schedule:
    # UTC 时间，北京时间为这些值 +8；错开到 17 分，避开整点排队高峰
    - cron: '17 0,1,2,3,4,5 * * *'

permissions:
  contents: read

jobs:
  # 第一步：决定这一步要不要真的发。Cloudflare / 手动触发一律放行，
  # GitHub 自家 cron 需要过「已到 08:00」+「当天还没发过」两道闸。
  should-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.final.outputs.run }}
      day: ${{ steps.gate.outputs.day }}
    steps:
      - name: 时间闸门
        id: gate
        run: |
          set -e
          DAY=$(TZ=Asia/Shanghai date +%F)
          HOUR=$(TZ=Asia/Shanghai date +%H)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "force=${{ github.event.inputs.force || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "北京时间 $DAY $(TZ=Asia/Shanghai date +%H:%M)，触发来源 ${{ github.event_name }}，force=${{ github.event.inputs.force || 'false' }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" -lt 8 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "结论：定时任务早于 08:00，跳过"
          else
            echo "run=maybe" >> "$GITHUB_OUTPUT"
            echo "结论：时间窗口通过，继续检查幂等标记"
          fi

      - name: 查当日幂等标记
        id: dedup
        if: steps.gate.outputs.run == 'maybe' && steps.gate.outputs.force != 'true'
        uses: actions/cache@v4
        with:
          path: .destiny-state
          key: destiny-sent-${{ steps.gate.outputs.day }}
          lookup-only: true

      - name: 最终裁决
        id: final
        run: |
          if [ "${{ steps.gate.outputs.force }}" = "true" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "手动强制发送，忽略幂等标记"
            exit 0
          fi
          case "${{ steps.gate.outputs.run }}" in
            no) echo "run=no" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "${{ steps.dedup.outputs.cache-hit }}" = "true" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "今天 ${{ steps.gate.outputs.day }} 已经成功发过，跳过本次"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "今天还没发，执行发送"
          fi

  daily-report:
    needs: should-run
    if: needs.should-run.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查依赖（本项目只用标准库）
        run: |
          python -V
          python -c "import math, json, smtplib, urllib.request; print('stdlib ok')"

      - name: 校验必要 Secrets
        env:
          DESTINY_BIRTH: ${{ secrets.DESTINY_BIRTH }}
          DESTINY_LONGITUDE: ${{ secrets.DESTINY_LONGITUDE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -u
          missing=0
          for v in DESTINY_BIRTH DESTINY_LONGITUDE MAIL_TO SMTP_USER SMTP_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 Secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "请到 Settings → Secrets and variables → Actions 补齐后再运行"
            exit 1
          fi
          echo "Secrets 齐全"

      - name: 生成个人档案（profile.json 不入库，由 Secrets 现场生成）
        env:
          DESTINY_NAME: ${{ secrets.DESTINY_NAME }}
          DESTINY_GENDER: ${{ secrets.DESTINY_GENDER }}
          DESTINY_BIRTH: ${{ secrets.DESTINY_BIRTH }}
          DESTINY_LONGITUDE: ${{ secrets.DESTINY_LONGITUDE }}
          DESTINY_CITY: ${{ secrets.DESTINY_CITY }}
          DESTINY_EMAIL: ${{ secrets.MAIL_TO }}
        run: python scripts/make_profile.py --force

      - name: 生成当日报告
        env:
          TZ: Asia/Shanghai
          DESTINY_TZ_OFFSET: '8'
        run: |
          mkdir -p output
          python daily_run.py --stdout-text

      - name: 定位产物
        id: locate
        run: |
          set -e
          TXT=$(ls -1t output/destiny-*.txt | head -1)
          HTML="${TXT%.txt}.html"
          MAIL="${TXT%.txt}.mail.html"
          test -s "$TXT" || { echo "::error::文本报告为空"; exit 1; }
          # 邮件排版版缺失时退回浏览器版，不因为这一个文件中断整轮推送
          if [ ! -s "$MAIL" ]; then
            echo "::warning::邮件排版版缺失，退回浏览器版作为正文"
            MAIL="$HTML"
          fi
          echo "txt=$TXT"   >> "$GITHUB_OUTPUT"
          echo "html=$HTML" >> "$GITHUB_OUTPUT"
          echo "mail=$MAIL" >> "$GITHUB_OUTPUT"
          echo "day=$(basename "$TXT" .txt | sed 's/destiny-//')" >> "$GITHUB_OUTPUT"
          echo "报告文件：$TXT"

      - name: 推送邮件
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SSL: '1'
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: 五术日课
        run: |
          # 参数顺序：文本摘要  邮件正文(排版版)  附件(完整版)
          python notify_mail.py \
            "${{ steps.locate.outputs.txt }}" \
            "${{ steps.locate.outputs.mail }}" \
            "${{ steps.locate.outputs.html }}"

      - name: 准备幂等标记文件
        run: |
          mkdir -p .destiny-state
          echo "${{ needs.should-run.outputs.day }}" > .destiny-state/day.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .destiny-state/sent-at.txt
          echo "run ${{ github.run_id }} / ${{ github.event_name }}" > .destiny-state/run.txt

      - name: 记录当日已发送（幂等标记）
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .destiny-state
          key: destiny-sent-${{ needs.should-run.outputs.day }}

      - name: 失败告警
        if: ${{ failure() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SSL: '1'
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DAY=$(date -u -d '+8 hours' +%Y-%m-%d)
          python notify_mail.py \
            --subject "[失败] 每日运势未生成 ${DAY}" \
            --body "今日运势报告在云端生成失败，请到 Actions 运行日志查看原因。常见原因：Secrets 缺失或失效、SMTP 授权码失效、Python 依赖缺失。（BTC 行情源超时已有降级设计，不应导致整轮失败。）"
