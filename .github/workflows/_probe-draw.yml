# 临时探针：验证境外出口能否取到开奖数据（不生成报告、不发信）
# 用途：修好备用源后，在真实的 GitHub Actions 出口上确认取数链路可用。
# 验证完即删除。
name: 取数探针（临时）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 从境外出口取三个彩种的开奖数据
        run: |
          python - <<'PY'
          import time, sys
          sys.path.insert(0, ".")
          from engine import lottery_result as L

          for game in ("双色球", "快乐8", "大乐透"):
              t0 = time.time()
              rows = L.fetch_draws(game, 20)
              st = L._FETCH_STATE.get(game, {})
              print(f"[probe] {game}: rows={len(rows)} source={st.get('source')} "
                    f"latest={(rows[0]['date'] if rows else '-')} "
                    f"tries={st.get('tries_500')} cost={time.time()-t0:.1f}s")
              if not rows:
                  print(f"::warning::{game} 取数为空，state={st}")
          PY